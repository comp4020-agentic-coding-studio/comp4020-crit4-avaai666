<!doctype html>

    <meta charset="UTF-8" />

    <title>Bianzhong</title>
    <meta
      name="description"
      content="A playable bianzhong: ten bronze chime bells in the browser, each struck at two points for two different pitches."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />

        <a href="./">Home</a>

    <main>

      <!-- Shared bell silhouette, referenced by every button below so the

            />

              <circle cx="25" cy="18" r="2.2" />
              <circle cx="35" cy="18" r="2.2" />
              <circle cx="45" cy="18" r="2.2" />
              <circle cx="55" cy="18" r="2.2" />
              <circle cx="65" cy="18" r="2.2" />
              <circle cx="75" cy="18" r="2.2" />

              <circle cx="25" cy="42" r="2.2" />
              <circle cx="35" cy="42" r="2.2" />
              <circle cx="45" cy="42" r="2.2" />
              <circle cx="55" cy="42" r="2.2" />

              <circle cx="75" cy="42" r="2.2" />
              <circle cx="25" cy="54" r="2.2" />

              <circle cx="45" cy="54" r="2.2" />
              <circle cx="55" cy="54" r="2.2" />
              <circle cx="65" cy="54" r="2.2" />
              <circle cx="75" cy="54" r="2.2" />
              <circle cx="25" cy="66" r="2.2" />
              <circle cx="35" cy="66" r="2.2" />
              <circle cx="45" cy="66" r="2.2" />
              <circle cx="55" cy="66" r="2.2" />
              <circle cx="65" cy="66" r="2.2" />
              <circle cx="75" cy="66" r="2.2" />
              <circle cx="25" cy="78" r="2.2" />
              <circle cx="35" cy="78" r="2.2" />
              <circle cx="45" cy="78" r="2.2" />
              <circle cx="55" cy="78" r="2.2" />
              <circle cx="65" cy="78" r="2.2" />
              <circle cx="75" cy="78" r="2.2" />
            </g>
          </symbol>
        </defs>
      </svg>

      <div class="rack" id="rack">
        <button
          type="button"
          class="bell bell--first"
          data-bell="1"
          data-key-zhenggu="KeyA"
          data-key-cegu="KeyQ"
        >
          <svg class="bell-svg" viewBox="0 0 100 130" aria-hidden="true" focusable="false">
            <use href="#bell-shape"></use>
          </svg>
          <span class="mark mark-centre" aria-hidden="true"></span>
          <span class="mark mark-corner" aria-hidden="true"></span>
          <span class="bell-label" lang="zh">黄钟</span>
        </button>
        <button
          type="button"
          class="bell"
          data-bell="2"

          data-key-cegu="KeyW"
