<!doctype html>
<html lang="en-AU">

    <title>Bianzhong</title>
    <meta
      name="description"
      content="A playable bianzhong: twelve bronze chime bells in the browser, each struck at two points for two different pitches."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary"></nav>
    </header>
    <main>
      <h1 class="sr-only">Bianzhong</h1>

      <!-- Shared bell silhouette, referenced by every button below so the
           markup isn't repeated twelve times. Front elevation, anatomy and
           proportions read off photographs of five real bells — see
           FACT-CHECK.md for the source and what's still inferred:
             shank (yong) at top; flat top plate (wu) with a decorated
             band; nearly rectangular body (~1.05 flare, ~1.5x width in
             height); a central vertical panel (zheng) dividing the upper
             body, with a block of nine bosses (mei), 3x3, either side;
             a smooth lower body (gu) below the boss line, where the
             strike marks belong; a deep, upward-concave bottom rim (yu
             kou) with its two corners (xian) as the lowest part of the
             bell. -->
      <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <defs>
          <!-- Metal finish (D2): lighter near the shoulder, darker toward
               the rim. userSpaceOnUse with explicit y1/y2 in the symbol's
               own 100x160 viewBox, not objectBoundingBox, so a y-fraction
               here means the same thing it means in src/layout.ts (0 at
               the very top of the viewBox, 1 at y=160) — see
               FACT-CHECK.md "Metal finish" for the contrast numbers that
               depend on that. Stops mirror src/color.ts's
               BELL_GRADIENT_TOP/BELL_GRADIENT_BOTTOM by hand, the same way
               styles.css's --bell-w already mirrors src/scale.ts. -->
          <linearGradient id="bell-gradient" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#b27337" />
            <stop offset="1" stop-color="#382411" />
          </linearGradient>
          <symbol id="bell-shape" viewBox="0 0 100 160">
            <rect class="bell-shank" x="44" y="0" width="12" height="40" />
            <path class="bell-outline" d="M12 40 L88 40 L90 160 Q50 100 10 160 Z" />
            <rect class="bell-wu" x="12" y="40" width="76" height="10" />
            <line class="bell-divider" x1="50" y1="50" x2="50" y2="95" />
            <line class="bell-divider" x1="11" y1="95" x2="89" y2="95" />
            <g class="bell-nubs">
              <circle cx="22" cy="60" r="2.2" /> <circle cx="31" cy="60" r="2.2" /> <circle cx="40" cy="60" r="2.2" />
              <circle cx="22" cy="72" r="2.2" /> <circle cx="31" cy="72" r="2.2" /> <circle cx="40" cy="72" r="2.2" />
              <circle cx="22" cy="84" r="2.2" /> <circle cx="31" cy="84" r="2.2" /> <circle cx="40" cy="84" r="2.2" />
              <circle cx="60" cy="60" r="2.2" /> <circle cx="69" cy="60" r="2.2" /> <circle cx="78" cy="60" r="2.2" />
              <circle cx="60" cy="72" r="2.2" /> <circle cx="69" cy="72" r="2.2" /> <circle cx="78" cy="72" r="2.2" />
              <circle cx="60" cy="84" r="2.2" /> <circle cx="69" cy="84" r="2.2" /> <circle cx="78" cy="84" r="2.2" />
            </g>
          </symbol>
        </defs>
      </svg>

      <div class="rack-frame">
      <!-- Mallet (D1): follows the pointer over the rack, swings on
           strike. Mouse only — src/ui.ts never adds .mallet--visible for
           touch or keyboard input, so this stays invisible for both with
           no separate markup. aria-hidden: it carries no information not
           already on the bell it's over. A sibling of .rack, not a child
           of it — .rack must contain bell cells and nothing else, or
           positional CSS selectors keyed to bell count (see styles.css
           .bell-cell[data-bell]) silently shift by one. -->
      <div class="mallet" id="mallet" aria-hidden="true"></div>
      <div class="rack" id="rack">
        <div class="bell-cell bell-cell--first" data-bell="1">
          <button
            type="button"
            class="bell bell--first"
            data-bell="1"
            aria-label="huangzhong bell, lower tier"
            aria-keyshortcuts="A"
            data-key-zhenggu="KeyA"
            data-key-cegu="KeyZ"
          >
            <svg class="bell-svg" viewBox="0 0 100 160" aria-hidden="true" focusable="false">
              <use href="#bell-shape"></use>
            </svg>
            <span class="mark mark-centre" aria-hidden="true"></span>
            <span class="mark mark-corner-left" aria-hidden="true"></span>
            <span class="mark mark-corner-right" aria-hidden="true"></span>
          </button>
          <p class="bell-caption">
            <span class="bell-caption-zh" lang="zh">黄钟</span>
            <span class="bell-caption-en">huangzhong</span>
          </p>
        </div>
        <div class="bell-cell" data-bell="2">
          <button
            type="button"
            class="bell"
            inert
            data-bell="2"
            aria-label="taicu bell, lower tier"
            aria-keyshortcuts="S"
            data-key-zhenggu="KeyS"
            data-key-cegu="KeyX"

        </div>
        <div class="bell-cell" data-bell="7">

      </div>
    </main>
    <footer>
      <p>Twelve of the sixty-five bells of Marquis Yi of Zeng, 433 BCE.</p>
      <!-- The tune (B4): plays src/melody.ts's MOLIHUA_OPENING through the
           exact same strike() path a real bell click uses — see src/ui.ts.
           Two-state button: its own visible text is its accessible name,
           updated on state change, so no separate aria-label is needed.
           data-label-idle/-playing are placeholders — see the session's
           report for the exact strings needed. -->
      <p>
        <button
          type="button"
          id="play-tune"
          data-label-idle="Play the opening"
          data-label-playing="Playing…"
        >
          Play the opening
        </button>
      </p>
      <p><a href="./about.html">About the bells</a></p>
    </footer>
    <script type="module" src="./src/ui.ts"></script>
  </body>
</html>
